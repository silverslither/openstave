<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenStave Dashboard</title>
    <link rel="stylesheet" href="/dashboard/style.css">
    <script type="module" src="/dashboard/main.js"></script>
</head>

<body>
    <div id="header">
        <h1>OpenStave Dashboard</h1>
    </div>
    <div id="dashboard">
        <label for="link">Permanent Link</label>
        <a id="link"></a>
        <label for="password">Dashboard Password</label>
        <input id="password" type="password" maxlength="64">
        <h2>Live Status</h2>
        <div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="live">
                </tbody>
            </table>
        </div>
        <h2>Authentication</h2>
        <div id="authentication" style="overflow-wrap: break-word">
            <button style="width: 100%">Get Authentication</button>
            <span></span>
        </div>
    </div>
</body>

</html>
