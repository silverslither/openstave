<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenStave v0.3.3-beta</title>
    <link rel="stylesheet" href="/root/style.css">
    <script type="module" src="/root/main.js"></script>
</head>

<body>
    <div id="header">
        <h1>OpenStave v0.3.3-beta</h1>
    </div>
    <div id="create-race">
        <h2>Create Race</h2>
        <label for="key">Global Key (ask the server administrator)</label>
        <input id="key" type="password">
        <label for="password">Dashboard Password (<button id="show-hide-password" class="textbtn">show/hide</button>)</label>
        <input id="password" type="password" maxlength="64">
        <label for="id">Race ID</label>
        <input id="id" type="text" maxlength="56">
        <label for="game">Category</label>
        <select id="game">
            <option value="smb1_any%">Super Mario Bros. Any%</option>
            <option value="smb1_warpless">Super Mario Bros. Warpless</option>
            <option value="smb2j_any%">Super Mario Bros. 2 (Japan) Any%</option>
            <option value="smb2j_warpless">Super Mario Bros. 2 (Japan) Warpless</option>
            <option value="smb3_any%nww">Super Mario Bros. 3 Any% NWW</option>
        </select>
        <label for="players">Players (up to 16, one name per line)</label>
        <span class="textbox" id="players" role="textbox" contenteditable></span>
        <button id="submit">Submit</button>
        <span id="error"></span>
    </div>
</body>

</html>
