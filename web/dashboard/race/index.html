<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenStave Race Dashboard</title>
    <link rel="stylesheet" href="/common/ui.css">
    <script type="module" src="/dashboard/race/main.js"></script>
</head>

<body>
    <header>
        <h1>OpenStave Race Dashboard</h1>
    </header>
    <main>
        <label for="link">Permanent Link</label>
        <a id="link"></a>
        <label for="password">Dashboard Password</label>
        <input id="password" type="password">
        <h2>Live Status</h2>
        <div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="live">
                </tbody>
            </table>
            <span tabindex="-1"></span>
        </div>
        <h2>Authentication</h2>
        <div id="authentication">
            <button>Get Authentication</button>
            <span tabindex="-1"></span>
        </div>
    </main>
    <footer>
    </footer>
</body>

</html>
