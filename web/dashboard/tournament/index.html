<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenStave Tournament Dashboard</title>
    <script defer type="module" src="/dashboard/tournament/main.js"></script>
    <link rel="stylesheet" href="/common/ui.css">
</head>

<body>
    <header>
        <h1>OpenStave Tournament Dashboard</h1>
    </header>
    <main id="container">
        <label for="link">Permanent Link</label>
        <a id="link"></a>
        <label for="password">Dashboard Password</label>
        <input id="password" type="password">
        <h2>Actions</h2>
        <span>
            <button id="reload" class="textbtn">reload</button><br/>
            <button id="revert" class="textbtn">revert</button><br/>
            <button id="next" class="textbtn">next</button><br/>
        </span>
        <span></span>
        <h2>Rounds</h2>
        <div>
            <table>
                <tbody id="rounds">
                </tbody>
            </table>
            <span></span>
        </div>
    </main>
</body>

</html>
