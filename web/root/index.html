<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenStave v0.4.1-beta</title>
    <link rel="stylesheet" href="/root/style.css">
    <script type="module" src="/root/main.js"></script>
</head>

<body>
    <div id="header">
        <h1>OpenStave v0.4.1-beta</h1>
    </div>
    <div id="create">
        <label for="key">Key (ask the server administrator)</label>
        <input id="key" type="password">
        <label for="password">
            Dashboard Password (<button id="show-hide-password" class="textbtn">show/hide</button>)
        </label>
        <input id="password" type="password" maxlength="64">
        <label for="game">Category</label>
        <select id="game">
            <option value="smb1_any%">Super Mario Bros. Any%</option>
            <option value="smb1_warpless">Super Mario Bros. Warpless</option>
            <option value="smb2j_any%">Super Mario Bros. 2 (Japan) Any%</option>
            <option value="smb2j_warpless">Super Mario Bros. 2 (Japan) Warpless</option>
            <option value="smb3_any%nww">Super Mario Bros. 3 Any% NWW</option>
        </select>
        <h2>Create Race</h2>
        <label for="race-id">Race ID</label>
        <input id="race-id" type="text" maxlength="42">
        <label for="race-players">Players (up to 16, one name per line)</label>
        <span class="textbox" id="race-players" role="textbox" contenteditable></span>
        <button id="race-submit">Submit</button>
        <span id="race-error"></span>
        <h2>Create Tournament</h2>
        <label for="tournament-id">Tournament ID</label>
        <input id="tournament-id" type="text" maxlength="36">
        <label for="tournament-type">Format</label>
        <select id="tournament-type">
            <option value="0">Round Robin</option>
            <option value="1">Single Elimination</option>
            <option value="2">Double Elimination</option>
        </select>
        <label for="tournament-arg" hidden></label>
        <input id="tournament-arg" type="number" hidden>
        <label for="tournament-players">Players (up to 16, one name per line)</label>
        <span class="textbox" id="tournament-players" role="textbox" contenteditable></span>
        <button id="tournament-submit">Submit</button>
        <span id="tournament-error"></span>
    </div>
</body>

</html>
